<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — DarkVisuals</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo">⚔ DarkVisuals</a>
    <nav>
      <a href="/#pricing">Цены</a>
      <a href="/register.html">Регистрация</a>
    </nav>
  </header>

  <main>
    <div class="form-card">
      <h2>Вход</h2>
      <div id="flash"></div>
      <form id="loginForm">
        <label for="username">Логин</label>
        <input type="text" id="username" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" required>

        <button type="submit" class="btn">Войти</button>
      </form>
      <div class="form-footer">
        Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
      </div>
    </div>
  </main>

  <footer>© 2026 DarkVisuals</footer>

  <script>
    const form = document.getElementById('loginForm');
    const flash = document.getElementById('flash');

    function showFlash(message, isError) {
      flash.innerHTML = `<div class="flash ${isError ? 'error' : 'success'}">${message}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('dv_username', username);
          localStorage.setItem('dv_password', password);
          window.location.href = '/profile.html';
        } else {
          showFlash(data.message || 'Ошибка входа', true);
        }
      } catch (err) {
        showFlash('Сервер недоступен. Попробуй позже.', true);
      }
    });
  </script>
</body>
</html>
